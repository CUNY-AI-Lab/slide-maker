name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: slide-maker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:5bdfa9e125367842206f66ac7e7022c18cd5cf2e13198fba9b68b8f0dc8b0468
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.4'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend types
        run: pnpm --filter @slide-maker/web check

      - name: Build workspaces
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Install browser for institutional-path acceptance
        # The pinned Playwright image supplies the matching browser and OS libraries;
        # avoid the runner's unavailable Ubuntu mirror during apt dependency setup.
        run: pnpm exec playwright install chromium

      - name: Verify mounted sign-in, persisted editing, model refusal and export
        run: pnpm exec playwright test --config e2e/fleet.config.ts
