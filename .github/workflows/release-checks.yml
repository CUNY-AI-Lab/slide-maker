name: Release safeguards
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-safeguards:
    name: Release safeguards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
      - name: Install disposable process-test runtime
        run: npm install --prefix "$RUNNER_TEMP/release-runtime" --no-audit --no-fund pm2@7.0.4 tsx@4.21.0
      - name: Verify source guards, release failure behavior and real process recovery
        run: CAIL_RELEASE_PM2="$RUNNER_TEMP/release-runtime/node_modules/pm2/bin/pm2" node --test scripts/release/*.test.mjs
